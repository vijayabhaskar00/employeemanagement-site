<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Employee Hub Developer API — Docs</title>
  <style>
    :root { --bd: #e2e8f0; --fg: #0f172a; --mut: #64748b; --accent: #2563eb; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--fg); }
    header { display: flex; align-items: center; gap: 1rem; padding: .6rem 1rem; border-bottom: 1px solid var(--bd); position: sticky; top: 0; background: #fff; z-index: 10; }
    header b { font-size: .95rem; }
    header .sp { flex: 1; }
    nav button { font: inherit; border: 1px solid var(--bd); background: #fff; padding: .35rem .8rem; border-radius: 6px; cursor: pointer; color: var(--mut); }
    nav button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    #guide { max-width: 820px; margin: 0 auto; padding: 2rem 1.25rem 5rem; }
    #guide h1 { margin-top: 0; }
    #guide h2 { margin-top: 2.2rem; padding-top: .4rem; border-top: 1px solid var(--bd); }
    #guide code { background: #f1f5f9; padding: .1rem .35rem; border-radius: 4px; font-size: .88em; }
    #guide pre { background: #0f172a; color: #e2e8f0; padding: 1rem; border-radius: 8px; overflow-x: auto; }
    #guide pre code { background: none; padding: 0; color: inherit; }
    #guide table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: .9rem; }
    #guide th, #guide td { border: 1px solid var(--bd); padding: .4rem .6rem; text-align: left; vertical-align: top; }
    #guide a { color: var(--accent); }
    #redoc { display: none; }
    .loading { padding: 3rem 1.25rem; color: var(--mut); text-align: center; }
  </style>
</head>
<body>
  <header>
    <b>Employee Hub Developer API</b>
    <span class="sp"></span>
    <nav>
      <button id="tab-guide" class="on">Guide</button>
      <button id="tab-ref">API Reference</button>
    </nav>
  </header>

  <article id="guide"><p class="loading">Loading…</p></article>
  <div id="redoc"><p class="loading">Loading reference…</p></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@14.1.2/marked.min.js"></script>
  <script>
    var guideEl = document.getElementById('guide');
    var redocEl = document.getElementById('redoc');
    var tabGuide = document.getElementById('tab-guide');
    var tabRef = document.getElementById('tab-ref');
    var redocLoaded = false;

    fetch('api-guide.md')
      .then(function (r) { return r.text(); })
      .then(function (md) { guideEl.innerHTML = marked.parse(md); })
      .catch(function () { guideEl.innerHTML = '<p>Could not load the guide. See the API Reference tab.</p>'; });

    function show(which) {
      var ref = which === 'ref';
      guideEl.style.display = ref ? 'none' : 'block';
      redocEl.style.display = ref ? 'block' : 'none';
      tabGuide.classList.toggle('on', !ref);
      tabRef.classList.toggle('on', ref);
      if (ref && !redocLoaded) {
        redocLoaded = true;
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/redoc@2.5.0/bundles/redoc.standalone.js';
        s.onload = function () {
          redocEl.innerHTML = '';
          Redoc.init('openapi.yaml', { hideDownloadButton: false, expandResponses: '200,201' }, redocEl);
        };
        document.body.appendChild(s);
      }
    }
    tabGuide.onclick = function () { show('guide'); };
    tabRef.onclick = function () { show('ref'); };
    if (location.hash === '#reference') show('ref');
  </script>
</body>
</html>
