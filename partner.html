<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Partner with Student Tribe</title>
  <meta name="description" content="Reach students on campus with Student Tribe. Tell us about your brand and we will get back to you." />
  <link rel="icon" href="logo.jpg" />
  <style>
    :root { --bg: #f6f7fb; --card: #ffffff; --text: #0f172a; --muted: #475569; --line: #e2e8f0; --accent: #4f46e5; --accent-2: #7c3aed; --ok: #047857; --bad: #be123c; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1020; --card: #121a2e; --text: #f1f5f9; --muted: #94a3b8; --line: #23304d; --accent: #818cf8; --accent-2: #a78bfa; --ok: #34d399; --bad: #fb7185; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 40px 16px 56px; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .brand img { width: 44px; height: 44px; border-radius: 12px; }
    .brand strong { font-size: 18px; }
    h1 { font-size: clamp(26px, 6vw, 34px); line-height: 1.15; margin: 0 0 8px; letter-spacing: -0.02em; }
    p.lead { color: var(--muted); margin: 0 0 24px; }
    form { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: grid; gap: 14px; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06); }
    label { display: grid; gap: 6px; font-size: 14px; font-weight: 600; }
    label span.opt { font-weight: 400; color: var(--muted); }
    input, textarea { width: 100%; font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; min-height: 44px; }
    input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    textarea { min-height: 110px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
    .trap { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    button { min-height: 48px; border: 0; border-radius: 12px; font: inherit; font-weight: 700; color: #fff; cursor: pointer; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
    button[disabled] { opacity: 0.7; cursor: wait; }
    .msg { margin: 0; font-size: 14px; font-weight: 600; }
    .msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
    .done { text-align: center; padding: 28px 22px; }
    .done h2 { margin: 8px 0; }
    footer { margin-top: 20px; font-size: 13px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="logo.jpg" alt="" /><strong>Student Tribe</strong></div>
    <h1>Partner with us</h1>
    <p class="lead">Reach students across campuses: sampling, fests, ambassadors and campaigns. Tell us a little about your brand and our team will reach out within one working day.</p>

    <form id="f" novalidate>
      <div class="row">
        <label>Company <input name="company" autocomplete="organization" required maxlength="120" /></label>
        <label>Your name <input name="name" autocomplete="name" required maxlength="80" /></label>
      </div>
      <div class="row">
        <label>Work email <input name="email" type="email" autocomplete="email" required maxlength="120" /></label>
        <label>Phone <span class="opt">(optional)</span><input name="phone" type="tel" autocomplete="tel" maxlength="30" /></label>
      </div>
      <label>What would you like to do? <span class="opt">(optional)</span>
        <textarea name="message" maxlength="2000" placeholder="e.g. Product sampling at 10 colleges in Pune in January"></textarea>
      </label>
      <div class="trap" aria-hidden="true"><label>Website <input name="website" tabindex="-1" autocomplete="off" /></label></div>
      <p class="msg" id="m" role="status" aria-live="polite"></p>
      <button id="b" type="submit">Send</button>
    </form>
    <footer>We only use these details to reply to you.</footer>
  </main>
  <script>
    (function () {
      var f = document.getElementById('f'), m = document.getElementById('m'), b = document.getElementById('b');
      var URL_ = 'https://us-central1-stpayrollinvoices.cloudfunctions.net/crmLeadForm';
      function say(t, ok) { m.textContent = t; m.className = 'msg ' + (ok ? 'ok' : 'bad'); }
      f.addEventListener('submit', function (e) {
        e.preventDefault();
        var d = {}; new FormData(f).forEach(function (v, k) { d[k] = String(v); });
        if (!d.company.trim() || !d.name.trim()) { say('Enter your company and your name.'); return; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email.trim())) { say('Enter a valid work email.'); f.email.focus(); return; }
        b.disabled = true; b.textContent = 'Sending…'; say('');
        fetch(URL_, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(d) })
          .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (x) {
            if (!x.ok) throw new Error(x.j.error || 'Could not send. Try again.');
            f.innerHTML = '<div class="done"><h2>Thank you!</h2><p class="lead" style="margin:0">We have your details. Someone from our brand team will be in touch within one working day.</p></div>';
          })
          .catch(function (err) { say(err.message || 'Could not send. Check your connection and try again.'); b.disabled = false; b.textContent = 'Send'; });
      });
    })();
  </script>
</body>
</html>
